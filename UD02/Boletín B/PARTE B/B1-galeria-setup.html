<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de mi setup</title>
</head>
<body>

    <h1>Galería de mi setup</h1>

    <h2>1. Imagen a tamaño original</h2>
    <img src="imagenes/setup.jpg"
         alt="Fotografía de mi setup">

    <h2>2. Imagen de 200 x 150 usando style</h2>
    <img src="imagenes/setup.jpg"
         alt="Fotografía de mi setup a tamaño pequeño"
         style="width: 200px; height: 150px;">

    <h2>3. Imagen de 200 x 150 usando width y height</h2>
    <img src="imagenes/setup.jpg"
         alt="Fotografía de mi setup con atributos de tamaño"
         width="200"
         height="150">

    <!--
    Pregunta:
    ¿Por qué se recomienda style frente a width y height?

    Respuesta:
    Porque style permite controlar el aspecto de la imagen mediante CSS y separar mejor el contenido HTML
    de su presentación.
    -->

</body>
</html>
