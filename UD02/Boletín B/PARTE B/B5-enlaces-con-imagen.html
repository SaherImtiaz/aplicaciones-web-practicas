<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enlaces con imagen</title>
</head>
<body>

    <h1>Enlaces con imagen</h1>

    <h2>1. Enlace cuyo rótulo es solo una imagen</h2>

    <a href="https://www.google.com/" target="_blank">
        <img src="imagenes/imagen.svg"
             alt="Visitar Google"
             width="150">
    </a>

    <h2>2. Enlace cuyo rótulo es una imagen y un texto</h2>

    <a href="https://www.wikipedia.org/" target="_blank">
        <img src="imagenes/teclado.png"
             alt="Imagen de un teclado"
             width="100">
        Visitar Wikipedia
    </a>

    <!--
    IDENTIFICACIÓN DE LOS ENLACES

    PRIMER ENLACE:
    Destino: https://www.google.com/
    Rótulo: La imagen imagen.svg.
    Objetivo: _blank, abre la página en una pestaña nueva.

    SEGUNDO ENLACE:
    Destino: https://www.wikipedia.org/
    Rótulo: La imagen teclado.png y el texto "Visitar Wikipedia".
    Objetivo: _blank, abre la página en una pestaña nueva.
    -->

</body>
</html>
