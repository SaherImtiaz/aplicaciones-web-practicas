<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis enlaces favoritos</title>
</head>
<body>

    <h1>Mis enlaces favoritos</h1>

    <p>
        <a href="https://www.w3.org/">
            Página oficial del W3C
        </a>
    </p>

    <p>
        <a href="https://www.google.com/" target="_blank">
            Google
        </a>
    </p>

    <p>
        <a href="https://www.wikipedia.org/" target="_blank"
           style="color: green;">
            Wikipedia
        </a>
    </p>

    <h2>Pregunta</h2>

    <p>
        Por defecto, un enlace que todavía no se ha visitado suele aparecer
        de color azul. Un enlace que ya se ha visitado suele aparecer
        de color morado.
    </p>

</body>
</html>
