<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensaje urgente</title>
</head>
<body>

    <h1>Alerta de ciberseguridad</h1>

    <p>
        <b><i><u>¡ATENCIÓN! Se ha detectado un intento de acceso no autorizado. Protege tus contraseñas y no abras enlaces
        sospechosos.</u></i></b>
    </p>

    <!--
    La secuencia correcta de cierre es:
    </u></i></b>

    Se cierran las etiquetas en orden inverso al que se abrieron. Primero se cierra la última etiqueta abierta (u), después i
    y finalmente b. Así, las etiquetas quedan correctamente anidadas.
    -->

    <h2>Prueba de etiquetas mal cerradas</h2>

    <p>
        <b><i><u>Este mensaje tiene las etiquetas mal cerradas.
    </b></u></i>
    </p>

</body>
</html>
