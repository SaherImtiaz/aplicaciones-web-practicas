<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartel del festival</title>
</head>
<body>

    <h1 style="border: 5px solid green;">
        Festival de Música 2026
    </h1>

    <p style="border: 3px dotted blue;">
        ¡Ven a disfrutar de un fin de semana lleno de música, diversión y buenos momentos!
    </p>

    <p style="background-color: lightpink; border: 5px double red;">
        Tres días de conciertos, actividades y espectáculos para todos los gustos.
    </p>

    <p>
        Actuarán nuestros artistas destacados:
        <span style="color: blue; font-size: 200%;">Aitana</span>
        y
        <span style="color: green; font-size: 200%;">Quevedo</span>.
    </p>

    <!--
    Pregunta:
    ¿Qué diferencia hay entre span y p para destacar parte de un texto?

    Respuesta:
    La etiqueta p sirve para crear un párrafo nuevo y ocupa todo el ancho disponible. En cambio, span sirve para seleccionar una parte pequeña
    de un texto y cambiar su estilo, sin crear un párrafo nuevo.
    -->

</body>
</html>
